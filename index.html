<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nishanth Gottumukkala | Portfolio</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, Segoe UI, sans-serif; margin: 0; background: #f4f4f4; color: #222; }
    header { padding: 48px 20px 24px; text-align: center; }
    header h1 { margin: 0 0 8px; font-size: 32px; }
    header p { margin: 0; color: #666; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto 40px;
    }
    .card {
      background: #fff; border-radius: 8px; overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,.1); transition: transform .2s, box-shadow .2s;
    }
    .card:hover { transform: translateY(-4px); box-shadow: 0 6px 16px rgba(0,0,0,.15); }
    .card a { text-decoration: none; color: inherit; display: block; }
    .card img { width: 100%; height: 220px; object-fit: cover; display: block; }
    .card h3 { margin: 12px 14px 4px; font-size: 16px; }
    .card span { display: block; margin: 0 14px 14px; font-size: 13px; color: #888; }
    .card.wide { grid-column: 1 / -1; }
    .card iframe { width: 100%; aspect-ratio: 16 / 9; height: auto; border: 0; display: block; }
    footer { text-align: center; padding: 24px; color: #888; font-size: 14px; }
  </style>
</head>
<body>

  <header>
    <h1>Nishanth Gottumukkala</h1>
    <p>Product Manager</p>
  </header>

  <main class="grid">

    <!-- SIM CARD PROJECT: Figma prototype embed -->
    <div class="card wide">
      <iframe src="https://embed.figma.com/proto/2KNz985oF5L4abF7FN4ddq/Untitled?node-id=1-3421&p=f&scaling=scale-down&content-scaling=fixed&page-id=0%3A1&starting-point-node-id=1%3A4245&embed-host=share"
              allowfullscreen loading="lazy"></iframe>
      <h3>SIM Card</h3>
      <span>UI Design, 2026</span>
    </div>

    <!-- RAISE DISPUTE FLOW: Figma prototype embed -->
    <div class="card wide">
      <iframe src="https://embed.figma.com/proto/2KNz985oF5L4abF7FN4ddq/Portfolio?node-id=38-9231&p=f&scaling=scale-down&content-scaling=fixed&page-id=0%3A1&starting-point-node-id=38%3A9976&show-proto-sidebar=1&embed-host=share"
              allowfullscreen loading="lazy"></iframe>
      <h3>Raise Dispute Flow</h3>
      <span>UI Design, 2026</span>
    </div>

  </main>

  <footer>
    &copy; 2026 Nishanth Gottumukkala &middot;
    <a href="mailto:you@example.com">you@example.com</a>
  </footer>

</body>
</html>
