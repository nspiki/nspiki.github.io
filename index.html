<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Name | Portfolio</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, Segoe UI, sans-serif; margin: 0; background: #f4f4f4; color: #222; }
    header { padding: 48px 20px 24px; text-align: center; }
    header h1 { margin: 0 0 8px; font-size: 32px; }
    header p { margin: 0; color: #666; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto 40px;
    }
    .card {
      background: #fff; border-radius: 8px; overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,.1); transition: transform .2s, box-shadow .2s;
    }
    .card:hover { transform: translateY(-4px); box-shadow: 0 6px 16px rgba(0,0,0,.15); }
    .card a { text-decoration: none; color: inherit; display: block; }
    .card img { width: 100%; height: 220px; object-fit: cover; display: block; }
    .card h3 { margin: 12px 14px 4px; font-size: 16px; }
    .card span { display: block; margin: 0 14px 14px; font-size: 13px; color: #888; }
    .card iframe { width: 100%; height: 316px; border: 0; display: block; }
    footer { text-align: center; padding: 24px; color: #888; font-size: 14px; }
  </style>
</head>
<body>

  <header>
    <h1>Your Name</h1>
    <p>Your profession, e.g. Photographer / UI Designer</p>
  </header>

  <main class="grid">

    <!-- PROJECT CARD (copy this block for each project) -->
    <div class="card">
      <a href="project1.html">
        <img src="images/project1.jpg" alt="Project One cover">
        <h3>Project One</h3>
        <span>Category, Year</span>
      </a>
    </div>

    <div class="card">
      <a href="project2.html">
        <img src="images/project2.jpg" alt="Project Two cover">
        <h3>Project Two</h3>
        <span>Category, Year</span>
      </a>
    </div>

    <div class="card">
      <a href="project3.html">
        <img src="images/project3.jpg" alt="Project Three cover">
        <h3>Project Three</h3>
        <span>Category, Year</span>
      </a>
    </div>

    <!-- BEHANCE EMBED CARD: replace the src with the iframe src from Behance (Share > Embed) -->
    <div class="card">
      <iframe src="https://www.behance.net/embed/project/XXXXXXXX?ilo0=1"
              allowfullscreen loading="lazy"
              allow="clipboard-write"
              referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </div>

  </main>

  <footer>
    &copy; 2026 Your Name &middot;
    <a href="mailto:you@example.com">you@example.com</a>
  </footer>

</body>
</html>
